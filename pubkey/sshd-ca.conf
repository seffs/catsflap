# Drop this in /etc/ssh/sshd.d/ (or append to /etc/ssh/sshd_config) on the host
# you want to reach, then reload sshd. It makes sshd trust any user certificate
# signed by step-ca's SSH user CA — and nothing else. There is no per-user key
# to manage and sshd never contacts the CA; it verifies each certificate offline
# against this one public key.
#
# Put step-ca's SSH USER CA public key at /etc/ssh/step_user_ca.pub. Get it with:
#   step ssh config --roots        # or read certs/ssh_user_ca_key.pub from step-ca
#
# The cert's principal must match the login user, so a cert issued for "alice"
# logs in as alice with no authorized_keys entry at all.

TrustedUserCAKeys /etc/ssh/step_user_ca.pub

# Optional hardening: certificates only, nothing else.
# PasswordAuthentication no
# AuthorizedKeysFile none
